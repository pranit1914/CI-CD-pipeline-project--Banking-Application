name: CICD pipeline for banking application

on:
  push:
    branches: ["main"]

jobs:

  # =========================
  # BUILD
  # =========================

  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Download Maven dependencies
        run: mvn dependency:resolve

      - name: Build with Maven
        run: mvn compile


  # =========================
  # SECURITY CHECK
  # =========================

  security-check:
    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Download Maven dependencies
        run: mvn dependency:resolve

      # -------------------------
      # TRIVY
      # -------------------------

      - name: Trivy FS Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          exit-code: 0

      # -------------------------
      # GITLEAKS
      # -------------------------

      - name: Install Gitleaks
        run: |
          sudo apt-get update
          sudo apt-get install -y gitleaks

      - name: Gitleaks Code Scan
        run: |
          gitleaks detect \
            --source . \
            --report-path gitleaks-report.json \
            --report-format json \
            --exit-code 1
